<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ADHD Detection Model</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				line-height: 1.6;
				margin: 0;
				padding: 20px;
				max-width: 800px;
				margin: 0 auto;
				color: #333;
			}
			h1 {
				color: #2c3e50;
				border-bottom: 2px solid #3498db;
				padding-bottom: 10px;
			}
			.container {
				background-color: #f9f9f9;
				border-radius: 8px;
				padding: 20px;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			}
			.form-group {
				margin-bottom: 15px;
			}
			label {
				display: block;
				margin-bottom: 5px;
				font-weight: bold;
			}
			input[type="file"],
			input[type="number"] {
				width: 100%;
				padding: 8px;
				border: 1px solid #ddd;
				border-radius: 4px;
				box-sizing: border-box;
			}
			button {
				background-color: #3498db;
				color: white;
				border: none;
				padding: 10px 15px;
				cursor: pointer;
				border-radius: 4px;
				font-size: 16px;
			}
			button:hover {
				background-color: #2980b9;
			}
			#result {
				margin-top: 20px;
				padding: 15px;
				border-radius: 4px;
				display: none;
			}
			.adhd {
				background-color: #f8d7da;
				border: 1px solid #f5c6cb;
				color: #721c24;
			}
			.no-adhd {
				background-color: #d4edda;
				border: 1px solid #c3e6cb;
				color: #155724;
			}
			.loading {
				text-align: center;
				margin: 20px 0;
				display: none;
			}
			.spinner {
				border: 4px solid #f3f3f3;
				border-top: 4px solid #3498db;
				border-radius: 50%;
				width: 30px;
				height: 30px;
				animation: spin 2s linear infinite;
				margin: 0 auto;
			}
			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>ADHD Detection Model</h1>
			<p>
				Upload a .mat file containing neuroimaging data to predict ADHD status
				using our machine learning model.
			</p>

			<form id="prediction-form">
				<div class="form-group">
					<label for="file">Upload .mat File:</label>
					<input type="file" id="file" name="file" accept=".mat" required />
				</div>

				<div class="form-group">
					<label for="threshold">Classification Threshold (0.0 - 1.0):</label>
					<input
						type="number"
						id="threshold"
						name="threshold"
						min="0"
						max="1"
						step="0.01"
						value="0.5"
					/>
				</div>

				<button type="submit">Make Prediction</button>
			</form>

			<div class="loading">
				<div class="spinner"></div>
				<p>Processing...</p>
			</div>

			<div id="result"></div>
		</div>

		<script>
			document
				.getElementById("prediction-form")
				.addEventListener("submit", function (e) {
					e.preventDefault();

					const form = new FormData();
					const fileInput = document.getElementById("file");
					const threshold = document.getElementById("threshold").value;

					form.append("file", fileInput.files[0]);
					form.append("threshold", threshold);

					const loading = document.querySelector(".loading");
					const result = document.getElementById("result");

					// Show loading spinner
					loading.style.display = "block";
					result.style.display = "none";

					fetch("/predict", {
						method: "POST",
						body: form,
					})
						.then((response) => response.json())
						.then((data) => {
							loading.style.display = "none";
							result.style.display = "block";

							if (data.error) {
								result.className = "";
								result.innerHTML = `<strong>Error:</strong> ${data.error}`;
							} else {
								// Format probability as percentage
								const probability = (data.probability * 100).toFixed(2);

								if (data.prediction === 1) {
									result.className = "adhd";
									result.innerHTML = `
                            <strong>Prediction:</strong> ADHD detected<br>
                            <strong>Confidence:</strong> ${probability}%<br>
                            <strong>Threshold:</strong> ${(
															data.threshold * 100
														).toFixed(2)}%
                        `;
								} else {
									result.className = "no-adhd";
									result.innerHTML = `
                            <strong>Prediction:</strong> No ADHD detected<br>
                            <strong>Confidence:</strong> ${(
															100 - probability
														).toFixed(2)}%<br>
                            <strong>Threshold:</strong> ${(
															data.threshold * 100
														).toFixed(2)}%
                        `;
								}
							}
						})
						.catch((error) => {
							loading.style.display = "none";
							result.style.display = "block";
							result.className = "";
							result.innerHTML = `<strong>Error:</strong> Failed to communicate with server`;
							console.error("Error:", error);
						});
				});
		</script>
	</body>
</html>
